name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      # Chrome for Testing: branded Chrome ignores --load-extension.
      - name: Install Chrome for Testing
        id: chrome
        shell: bash
        run: |
          line=$(npx -y @puppeteer/browsers@2.10.5 install chrome@stable --path "$RUNNER_TEMP/cft" | tail -1)
          echo "chrome-path=${line#* }" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: node --test --test-timeout=180000 test/*.test.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          REQUIRE_E2E: "1"

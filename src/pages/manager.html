<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Boosts</title>
    <link rel="icon" href="icon-32.png" />
    <link rel="stylesheet" href="common.css" />
    <style>
      .layout {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        min-height: 100vh;
      }
      #nav {
        border-right: 1px solid var(--line);
        padding: 18px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      #nav .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 650;
        margin: 0 8px 14px;
      }
      #nav a {
        padding: 7px 10px;
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
      }
      #nav a:hover {
        background: var(--soft);
      }
      #nav a.active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      #app {
        padding: 22px 28px 60px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 980px;
      }
      @media (max-width: 720px) {
        .layout {
          grid-template-columns: 1fr;
        }
        #nav {
          position: static;
          height: auto;
          flex-direction: row;
          flex-wrap: wrap;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: 10px 16px;
        }
        #nav .brand {
          margin: 0 8px 0 0;
        }
        #app {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav id="nav">
        <div class="brand"><img src="icon-32.png" width="22" height="22" alt="" /> Site Boosts</div>
        <a href="#">Boosts</a>
        <a href="#settings">Settings</a>
        <a href="#console">Console</a>
        <a href="setup.html">Setup</a>
      </nav>
      <main id="app"></main>
    </div>
    <script src="manager.js"></script>
  </body>
</html>

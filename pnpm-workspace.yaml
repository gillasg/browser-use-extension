packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Provider SDK install scripts are not needed: everything runs from the published JavaScript.
  "@google/genai": false
  protobufjs: false
minimumReleaseAgeExclude:
  - "@aeon/protocol"
  - pi-ai-login
  - "@earendil-works/pi-ai@1.2.0"
  - "@earendil-works/pi-telemetry@1.2.0"
